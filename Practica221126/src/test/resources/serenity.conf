serenity {
  project.name = "Practica 221126 - SolarWear"
  take.screenshots = AFTER_EACH_STEP
  browser.maximized = true
  browser = chrome
  headless.mode = false
  webdriver {
    driver = chrome
    capabilities {
      "goog:chromeOptions" {
        args = ["--start-maximized", "--disable-notifications", "--incognito"]
      }
    }
  }
}
